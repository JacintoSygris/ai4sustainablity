      subthemes:
        - name: expression
          description: Freedom of expression
        - name: assembly
          description: Freedom of assembly
        - name: human rights
          description: Incidents involving human rights defenders (e.g., retaliation, threats)
    - name: indigenous rights
      description: Rights of Indigenous Peoples
      subthemes:
        - name: consent
          description: Free, prior, and informed consent
        - name: self determination
          description: Right to self-determination
        - name: cultural rights
          description: Cultural rights (e.g., access to sacred sites, protection of cultural heritage)
