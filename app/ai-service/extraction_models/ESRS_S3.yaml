  description: Affected Communities
  themes:
    - name: economic rights
      description: Economic, Social and Cultural Rights of Affected Groups
      subthemes:
        - name: communities housing
          description: Adequate housing
        - name: communities food
          description: Adequate food
        - name: communities water
          description: Water and sanitation
